# Fly.io: önce `fly launch --no-deploy --copy-config`, sonra `fly volumes create voxel_data --size 1`, sonra `fly deploy`
app = "voxel-arena"          # benzersiz bir ad yaz
primary_region = "fra"       # Türkiye'ye en yakın: Frankfurt

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[mounts]
  source = "voxel_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # sürekli açık
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"
