<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Voxel Arena</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#ffb000; --amber-dim:#c47f00; --ink:#0b1220; --panel:rgba(8,12,20,.62); --line:rgba(255,255,255,.14);
    --grass:#5db04a; --sky:#8ecbff; --gold:#ffd23f; --red:#ff4d3d; --blue:#3a7bd5;
    --pix:'Silkscreen','Courier New',monospace; --hud:'Rajdhani','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;font-family:var(--hud);color:#fff;user-select:none;-webkit-user-select:none}
  canvas#gl{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;display:none}
  body.playing #hud{display:block}

  /* nişangâh */
  #cross{position:absolute;left:50%;top:50%;width:0;height:0}
  #cross i{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.55);transition:transform .08s}
  #cross .h{width:7px;height:2px;top:-1px}#cross .v{width:2px;height:7px;left:-1px}
  #cross .l{left:calc(-7px - var(--gap,5px))}#cross .r{left:var(--gap,5px)}
  #cross .t{top:calc(-7px - var(--gap,5px))}#cross .b{top:var(--gap,5px)}
  #hit{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0}
  #hit:before,#hit:after{content:"";position:absolute;left:12px;top:-5px;width:2px;height:36px;background:#fff;transform:rotate(45deg);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
  #hit:after{transform:rotate(-45deg)}
  #hit.head:before,#hit.head:after{background:var(--red)}
  #hit.on{opacity:1}
  #scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at center,transparent 0,transparent 31vmin,#000 31.4vmin)}
  #scope:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000}
  #scope:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:#000}
  #vig{position:absolute;inset:0;box-shadow:inset 0 0 170px 30px rgba(220,0,0,0);transition:box-shadow .35s}
  #dirwrap{position:absolute;left:50%;top:50%;width:280px;height:280px;margin:-140px 0 0 -140px;opacity:0;transition:opacity .6s}
  #dirarc{width:100%;height:100%;border-radius:50%;border:9px solid transparent;border-top-color:rgba(255,50,40,.85)}

  /* Half-Life tarzı sağlık / zırh / cephane */
  .hl{position:absolute;bottom:18px;display:flex;align-items:flex-end;gap:18px;padding:8px 16px 6px;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--amber);text-shadow:0 0 10px rgba(255,176,0,.35)}
  .hl .cell{display:flex;align-items:baseline;gap:8px}
  .hl .lab{font-size:13px;font-weight:700;letter-spacing:.14em;opacity:.9}
  .hl .num{font-size:46px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:right}
  #stat{left:18px}
  #ammo{right:18px}
  .hl.low{color:var(--red);text-shadow:0 0 12px rgba(255,60,40,.6)}
  .hl.low .num{animation:blink .7s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  #ammo .sub{font-size:20px;opacity:.75;font-weight:600}
  #wname{position:absolute;right:18px;bottom:82px;font-family:var(--pix);font-size:12px;letter-spacing:.08em;color:#fff;text-shadow:0 1px 3px #000}
  #wbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px}
  .ws{min-width:74px;padding:5px 9px 4px;border:2px solid rgba(255,255,255,.18);background:var(--panel);font-size:13px;font-weight:600;text-align:center;opacity:.7}
  .ws b{color:var(--amber);margin-right:5px;font-family:var(--pix);font-size:11px}
  .ws.sel{border-color:var(--amber);opacity:1;background:rgba(255,176,0,.16)}
  #dash{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);width:120px;height:5px;background:rgba(255,255,255,.14)}
  #dashf{height:100%;width:100%;background:var(--blue)}

  /* üst bilgi */
  #top{position:absolute;left:50%;top:12px;transform:translateX(-50%);text-align:center;background:var(--panel);border:1px solid var(--line);padding:6px 22px 7px;min-width:230px}
  #mode{font-family:var(--pix);font-size:11px;letter-spacing:.12em;color:var(--gold)}
  #score{font-size:30px;font-weight:700;line-height:1}
  #leader{font-size:13px;opacity:.8}
  #mapname{font-size:12px;opacity:.65;letter-spacing:.1em}
  #mini{position:absolute;left:14px;top:14px;width:150px;height:150px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:#0008;overflow:hidden}
  #feed{position:absolute;right:14px;top:14px;width:min(360px,46vw);display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:15px;font-weight:600}
  #feed div{background:var(--panel);padding:3px 9px;border-left:3px solid var(--gold)}
  #feed div.me{border-left-color:var(--red);background:rgba(120,20,10,.55)}
  #pops{position:absolute;left:50%;top:60%;transform:translateX(-50%);text-align:center;font-family:var(--pix);font-size:15px;color:var(--gold);text-shadow:0 2px 0 #000}
  #msg{position:absolute;left:50%;top:28%;transform:translateX(-50%);font-family:var(--pix);font-size:clamp(20px,4vw,38px);text-align:center;display:none;text-shadow:0 3px 0 #000;line-height:1.5}
  #msg small{font-family:var(--hud);font-size:20px;display:block;opacity:.9;text-shadow:0 1px 4px #000}
  #board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;min-width:min(520px,92vw);background:rgba(6,10,18,.8);border:1px solid var(--line);padding:10px 14px}
  #board table{width:100%;border-collapse:collapse;font-size:16px;font-weight:600}
  #board th{font-family:var(--pix);font-size:10px;letter-spacing:.1em;color:var(--gold);font-weight:400;padding-bottom:6px}
  #board th,#board td{padding:3px 10px;text-align:right}
  #board th:first-child,#board td:first-child{text-align:left}
  #board tr.me td{color:var(--amber)}
  #pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,14,.55);z-index:4;font-family:var(--pix);text-align:center;line-height:2;cursor:pointer}
  body.playing.paused #pause{display:flex}

  /* sohbet (oyun içi) */
  #chatwrap{position:absolute;left:18px;bottom:96px;width:min(380px,60vw);font-size:15px;font-weight:600}
  #chatlog div{background:var(--panel);padding:2px 8px;margin-top:2px;text-shadow:0 1px 2px #000;transition:opacity .6s}
  #chatlog div.old{opacity:0}
  #chatlog b{color:var(--gold)}#chatlog b.me{color:var(--amber)}
  #chatin{display:none;width:100%;margin-top:4px;padding:7px 9px;border:2px solid var(--gold);background:rgba(0,0,0,.7);color:#fff;font:600 16px var(--hud);outline:none;pointer-events:auto;user-select:text;-webkit-user-select:text}
  #chatwrap.open #chatin{display:block}
  #chatwrap.open #chatlog div.old{opacity:1}

  /* duraklatma menüsü */
  #results{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(5,8,14,.72);padding:12px;overflow:auto}
  .rbox{width:min(96vw,520px);background:rgba(8,12,22,.95);border:2px solid var(--line);padding:16px 20px;margin:auto}
  .rtitle{font:700 34px var(--pix);text-align:center;letter-spacing:.06em}.rtitle.win{color:var(--gold);text-shadow:0 3px 0 #7a5a00}.rtitle.lose{color:#ff6b5e;text-shadow:0 3px 0 #5a1710}
  .rsub{text-align:center;opacity:.75;font-size:15px;margin:2px 0 8px}
  .rbox table{width:100%;border-collapse:collapse;font-size:15px;font-weight:600}.rbox th{font:400 10px var(--pix);color:var(--gold);text-align:left;padding:3px 4px}.rbox td{padding:2px 4px}.rbox tr.me td{color:var(--amber)}
  .rlines{margin-top:10px;border-top:1px solid var(--line);padding-top:6px;font-size:16px;font-weight:600}.rlines>div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}.rlines b{color:var(--gold)}
  .rlines .rh{font:400 10px var(--pix);color:var(--gold);opacity:.9}.rlines .rsum{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-size:18px}
  .rlines .drop{display:block;text-align:center;background:rgba(255,176,0,.16);color:var(--amber);padding:5px;margin-top:6px}
  .rbtns{margin-top:10px}
  #pause{cursor:default;font-family:var(--hud);line-height:1.3}
  #pbox{width:min(92vw,380px);padding:22px 24px 20px;background:rgba(8,12,22,.92);border:2px solid var(--line);box-shadow:0 8px 0 rgba(0,0,0,.4);text-align:left}
  #pbox h2{margin:0 0 14px;font:700 20px var(--pix);letter-spacing:.06em;color:var(--gold);text-align:center}
  .btn{display:block;width:100%;padding:12px;margin-top:8px;border:0;background:rgba(255,255,255,.1);color:#fff;font:700 18px var(--hud);letter-spacing:.04em;cursor:pointer;border-bottom:3px solid rgba(0,0,0,.4)}
  .btn:hover{background:rgba(255,255,255,.18)}
  .btn:focus-visible,.nav button:focus-visible,.seg:focus-visible,.card2:focus-visible,#play:focus-visible,.tab:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .btn.go{background:var(--grass);color:#10260a;border-bottom-color:#2f6e22}
  .btn.go:hover{background:#6cc258}
  .btn.warn{background:#7a2a22}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .srow{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;gap:8px;margin-top:10px;font-weight:700;font-size:15px}
  .srow input{width:100%;accent-color:var(--gold)}
  .srow output{text-align:right;color:var(--gold)}
  .phint{margin-top:12px;font-size:13px;opacity:.7;text-align:center}

  /* ana menü (lobi) */
  #menu{position:fixed;inset:0;z-index:5;display:grid;grid-template-columns:168px 1fr minmax(320px,430px);grid-template-rows:auto 1fr auto;gap:12px;padding:14px 16px;pointer-events:none;
    background:linear-gradient(180deg,rgba(6,12,24,.55) 0,rgba(6,12,24,0) 22%,rgba(6,12,24,0) 70%,rgba(6,12,24,.65) 100%)}
  body.playing #menu{display:none}
  #menu>*{pointer-events:auto}
  #topbar{grid-column:1/4;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{font-family:var(--pix);font-weight:700;font-size:28px;line-height:.95;letter-spacing:.02em;color:#fff;text-shadow:0 3px 0 #2a6bd0,0 6px 0 #0b1b3a;margin:0}
  .logo span{color:var(--gold)}
  #me{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:6px 12px}
  #me input{width:150px;padding:4px 7px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:#fff;font:700 17px var(--hud);outline:none;user-select:text;-webkit-user-select:text}
  #me input:focus{border-color:var(--gold)}
  #lvl{font-family:var(--pix);font-size:11px;color:var(--gold);white-space:nowrap}
  #xpbar{width:90px;height:8px;background:rgba(255,255,255,.15)}#xpbar i{display:block;height:100%;width:0;background:var(--grass)}
  #cur{margin-left:auto;display:flex;gap:8px}
  .chip{background:var(--panel);border:1px solid var(--line);padding:6px 12px;font-weight:700;font-size:17px;white-space:nowrap}
  .chip b{color:var(--gold)}.chip.gem b{color:#5fd8ff}
  .nav{grid-row:2;display:flex;flex-direction:column;gap:6px;align-self:start}
  .nav button{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid transparent;color:#fff;font:700 17px var(--hud);cursor:pointer;text-align:left}
  .nav button i{font-style:normal;width:20px;text-align:center;font-size:16px}
  .nav button:hover{background:rgba(255,255,255,.14)}
  .nav button.sel{border-left-color:var(--gold);background:rgba(255,210,63,.16);color:var(--gold)}
  .nav .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--red);display:none}
  .nav .dot.on{display:block}
  #center{grid-row:2;grid-column:2;position:relative;min-height:0}
  #center .hint{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:13px;opacity:.7;white-space:nowrap;text-shadow:0 1px 3px #000}
  #pvinfo{position:absolute;left:50%;top:6px;transform:translateX(-50%);text-align:center;font-weight:700;font-size:15px;color:var(--gold);text-shadow:0 1px 3px #000;min-height:20px}
  #side{grid-row:2;grid-column:3;display:flex;flex-direction:column;min-height:0;background:rgba(8,12,22,.82);border:1px solid var(--line)}
  #sidehead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  #sidehead h2{margin:0;font:700 14px var(--pix);letter-spacing:.08em;color:var(--gold)}
  .sample{margin-left:auto;font-size:11px;padding:2px 7px;background:rgba(255,176,0,.18);color:var(--amber);font-weight:700;letter-spacing:.06em}
  #sidebody{flex:1;overflow:auto;padding:10px 12px;min-height:0;user-select:text;-webkit-user-select:text}
  #sidefoot{padding:8px 12px;border-top:1px solid var(--line);display:none}
  #sidefoot.on{display:block}
  #sidefoot input{width:100%;padding:8px 10px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);color:#fff;font:600 16px var(--hud);outline:none}
  #sidefoot input:focus{border-color:var(--gold)}
  .tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .tab,.seg{padding:6px 11px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);color:#fff;font:700 14px var(--hud);cursor:pointer}
  .tab.sel,.seg.sel{background:rgba(255,210,63,.2);border-color:var(--gold);color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
  .card2{position:relative;padding:8px 6px 7px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);text-align:center;cursor:pointer;color:#fff;font:600 14px var(--hud)}
  .card2:hover{background:rgba(255,255,255,.14)}
  .card2.sel{border-color:var(--gold)}
  .card2.eq{border-color:var(--grass)}
  .card2 .ic{display:block;height:34px;margin:0 auto 5px;width:34px;border:2px solid rgba(0,0,0,.5);font:700 18px/30px var(--pix);color:#0008}
  .card2 .nm{display:block;font-weight:700;font-size:14px;line-height:1.15;min-height:32px}
  .card2 .pr{display:block;font-size:13px;color:var(--gold)}
  .card2 .pr.gem{color:#5fd8ff}
  .card2 .pr.own{color:#8be07a}
  .card2 .pr.no{opacity:.55}
  canvas.ico{display:block;margin:0 auto 4px;image-rendering:pixelated;image-rendering:crisp-edges}
  .card2 canvas.ico{margin:0 auto 6px}
  #detail{margin-top:10px;padding:10px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
  #detail h3{margin:0 0 2px;font-size:19px}
  #detail p{margin:2px 0 6px;font-size:14px;opacity:.8}
  .list>div{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px;font-weight:600}
  .list .grow{flex:1;min-width:0}
  .list small{display:block;font-size:12px;opacity:.65;font-weight:600}
  .list .on{color:#8be07a}.list .off{opacity:.5}
  .mini{padding:5px 11px;border:0;background:var(--grass);color:#10260a;font:700 14px var(--hud);cursor:pointer}
  .mini:disabled{opacity:.4;cursor:default}
  .mini.alt{background:rgba(255,255,255,.14);color:#fff}
  .bar{height:7px;background:rgba(255,255,255,.14);margin-top:3px}.bar i{display:block;height:100%;background:var(--amber)}
  .stat{display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:center;font-size:13px;margin:2px 0}
  .msgs{display:flex;flex-direction:column;gap:3px;font-size:15px;font-weight:600;line-height:1.3}
  .msgs b{color:var(--gold)}.msgs b.me{color:var(--amber)}.msgs .sys{opacity:.65;font-style:italic}
  .lab{display:block;font-family:var(--pix);font-size:10px;letter-spacing:.12em;color:var(--gold);margin:12px 0 5px}
  .rank{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center}
  .you{background:rgba(255,176,0,.14)}
  #bottom{grid-column:1/4;display:flex;align-items:flex-end;justify-content:center;gap:18px;flex-wrap:wrap}
  .sel-group{background:var(--panel);border:1px solid var(--line);padding:6px 10px 8px}
  .sel-group .lab{margin:0 0 4px}
  .row{display:flex;flex-wrap:wrap;gap:6px}
  #play{padding:14px 56px;border:0;background:var(--grass);color:#10260a;font:700 26px var(--pix);letter-spacing:.06em;cursor:pointer;box-shadow:0 6px 0 #2f6e22}
  #play:active{transform:translateY(3px);box-shadow:0 3px 0 #2f6e22}
  #status{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);color:#ff9f0a;font-size:15px;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none}
  .ov{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(4,7,13,.88);padding:12px;overflow:auto}
  .cbox{width:min(96vw,680px);margin:auto;background:rgba(10,15,26,.96);border:2px solid var(--line);padding:16px 18px;text-align:center}
  .cbox h2{margin:0 0 10px;font:700 18px var(--pix);color:var(--gold);letter-spacing:.08em}
  .reelwrap{position:relative;overflow:hidden;background:#05080f;border:2px solid var(--line);height:148px}
  .reel{display:flex;gap:8px;padding:8px 0 0;will-change:transform;position:absolute;left:0;top:0}
  .rcard{flex:none;width:120px;height:130px;border:3px solid;background:#141b29;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:13px;padding:4px}
  .marker{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
  .marker:before{content:"";position:absolute;top:0;left:-7px;border:8px solid transparent;border-top-color:var(--gold)}
  .reveal{margin-top:12px;padding:12px;border:3px solid;background:#101726;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  .reveal .rn{font:700 12px var(--pix);letter-spacing:.1em;margin-top:6px}.reveal h3{margin:4px 0;font-size:24px}.reveal p{margin:0 0 8px;opacity:.85}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  body.flash:after{content:"";position:fixed;inset:0;background:#fff;z-index:20;pointer-events:none;animation:fl .8s ease-out forwards}
  @keyframes fl{from{opacity:.55}to{opacity:0}}
  body.passwide #center{display:none}
  body.passwide #side{grid-column:2/4}
  .ph{position:relative;display:grid;grid-template-columns:minmax(0,1.3fr) 130px minmax(0,1fr);grid-template-areas:"l ring xp" "show show show";gap:10px 18px;padding:10px 14px;border:2px solid var(--c1);background:linear-gradient(120deg,color-mix(in srgb,var(--c1) 26%,#0a0f1c) 0,#0a0f1c 55%,color-mix(in srgb,var(--c2) 30%,#0a0f1c) 100%);overflow:hidden;box-shadow:0 0 28px color-mix(in srgb,var(--c1) 35%,transparent)}
  .ph:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.035) 22px 24px);pointer-events:none}
  .ph-l{grid-area:l;position:relative}.ph-ring{grid-area:ring}.ph-xp{grid-area:xp}.ph-show{grid-area:show}
  .ph-s{font:400 11px var(--pix);letter-spacing:.2em;color:var(--c1)}
  .ph-t{font:700 clamp(20px,2.8vw,32px)/1.05 var(--pix);color:#fff;text-shadow:0 0 18px var(--c1),0 4px 0 color-mix(in srgb,var(--c2) 60%,#000);margin:2px 0 4px}
  .ph-time{font-size:15px;opacity:.85}.ph-time b{color:var(--gold)}
  .ph-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
  .pgold{padding:9px 16px;border:0;font:700 15px var(--hud);letter-spacing:.04em;color:#3a2600;cursor:pointer;background:linear-gradient(100deg,#ffb300,#ffe27a,#ffb300);background-size:220% 100%;animation:shine 2.6s linear infinite;box-shadow:0 0 18px rgba(255,200,0,.55),0 4px 0 #8a5a00}
  .pgold:active{transform:translateY(2px)}
  @keyframes shine{from{background-position:0 0}to{background-position:-220% 0}}
  .ph-prem{padding:8px 14px;border:2px solid var(--gold);color:var(--gold);font:700 15px var(--hud);background:rgba(255,200,0,.12);text-shadow:0 0 10px rgba(255,200,0,.6)}
